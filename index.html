<script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(() => console.log("Service Worker běží!"))
                .catch((err) => console.log("Chyba SW: ", err));
        }

        const firebaseConfig = {
            apiKey: "AIzaSyDtVm7h3Sb_K-Q72dna57HBmBJON3r91yg",
            authDomain: "webovkachat.firebaseapp.com",
            projectId: "webovkachat",
            storageBucket: "webovkachat.firebasestorage.app",
            messagingSenderId: "976579792186",
            appId: "1:976579792186:web:57061eb9528b263d489403",
            measurementId: "G-5ZJ0NF52YM"
        };

        const app = initializeApp(firebaseConfig);
        // Tady explicitně předáváme URL tvé databáze z konzole:
        const db = getDatabase(app, "https://webovkachat-default-rtdb.firebaseio.com/");

        document.addEventListener('DOMContentLoaded', function() {
            const messageInput = document.getElementById('messageInput');
            const usernameInput = document.getElementById('username');
            const sendBtn = document.getElementById('sendBtn');
            const messagesBox = document.getElementById('messages');

            messagesBox.innerHTML = "";

            function sendMessage() {
                const text = messageInput.value.trim();
                const user = usernameInput ? usernameInput.value.trim() || "Anonym" : "Anonym";

                if (text === "") return;

                const messagesRef = ref(db, 'messages');
                push(messagesRef, {
                    username: user,
                    text: text,
                    timestamp: Date.now()
                });
                
                messageInput.value = "";
            }

            function escapeHtml(text) {
                const map = {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#039;'
                };
                return text.replace(/[&<>"']/g, function(m) { return map[m]; });
            }

            const messagesRef = ref(db, 'messages');
            onChildAdded(messagesRef, (snapshot) => {
                const data = snapshot.val();
                const msgDiv = document.createElement('div');
                msgDiv.className = 'msg';
                msgDiv.innerHTML = `<b>${escapeHtml(data.username)}:</b> ${escapeHtml(data.text)}`;
                
                messagesBox.appendChild(msgDiv);
                messagesBox.scrollTop = messagesBox.scrollHeight;
            });

            sendBtn.addEventListener('click', sendMessage);

            messageInput.addEventListener('keydown', function(event) {
                if (event.key === 'Enter') {
                    sendMessage();
                }
            });
        });
    </script>
