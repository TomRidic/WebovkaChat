<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webovka Chat 🤫</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a1a1a">
</head>
<body>
    <div class="chat-container">
        <div id="messages" class="messages-box">
            <div class="msg"><b>Systém:</b> Webovka Chat je připravena! 🚀</div>
        </div>
        <div class="input-box">
            <input type="text" id="username" placeholder="Jméno..." style="width: 25%;">
            <input type="text" id="messageInput" placeholder="Napiš zprávu...">
            <button id="sendBtn">Odeslat</button>
        </div>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(() => console.log("Service Worker běží!"))
                .catch((err) => console.log("Chyba SW: ", err));
        }

        document.addEventListener('DOMContentLoaded', function() {
            const messageInput = document.getElementById('messageInput');
            const usernameInput = document.getElementById('username');
            const sendBtn = document.getElementById('sendBtn');
            const messagesBox = document.getElementById('messages');

            function sendMessage() {
                const text = messageInput.value.trim();
                const user = usernameInput ? usernameInput.value.trim() || "Anonym" : "Anonym";

                if (text === "") return;

                const msgDiv = document.createElement('div');
                msgDiv.className = 'msg';
                msgDiv.innerHTML = `<b>${user}:</b> ${escapeHtml(text)}`;
                
                messagesBox.appendChild(msgDiv);
                messagesBox.scrollTop = messagesBox.scrollHeight;
                
                messageInput.value = "";
            }

            function escapeHtml(text) {
                const map = {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#039;'
                };
                return text.replace(/[&<>"']/g, function(m) { return map[m]; });
            }

            sendBtn.addEventListener('click', sendMessage);

            messageInput.addEventListener('keydown', function(event) {
                if (event.key === 'Enter') {
                    sendMessage();
                }
            });
        });
    </script>
</body>
</html>
